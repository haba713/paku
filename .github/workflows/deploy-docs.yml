name: deploy-docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_HOST: haba713.github.io/paku

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: cargo install mdbook-sitemap-generator --locked
      - run: mdbook build docs
      - name: Generate sitemap.xml
        working-directory: docs
        run: |
          mdbook-sitemap-generator -d "$SITE_HOST" -o book/sitemap.xml
          sed -i -e 's|\.md</loc>|.html</loc>|' \
                -e "s|<loc>https://$SITE_HOST</loc>|<loc>https://$SITE_HOST/</loc>|" book/sitemap.xml
          if grep -q '\.md</loc>' book/sitemap.xml; then
            echo "::error::sitemap.xml still has .md URLs"
            exit 1
          fi
          cat book/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
