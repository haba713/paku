name: deploy-docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://haba713.github.io/paku/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: mdbook build docs
      - name: Generate sitemap.xml
        working-directory: docs
        # One <url> per chapter in src/; root 1.0, chapters 0.8, index.html (duplicate of root) 0.5.
        run: |
          url() { printf '  <url>\n    <loc>%s</loc>\n    <priority>%s</priority>\n  </url>\n' "$1" "$2"; }
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            url "$SITE_URL" 1.0
            for md in $(cd src && find . -name '*.md' ! -name SUMMARY.md | sed 's|^\./||' | sort); do
              page="${md%.md}.html"
              priority=0.8
              [ "$page" = index.html ] && priority=0.5
              url "$SITE_URL$page" "$priority"
            done
            echo '</urlset>'
          } > book/sitemap.xml
          cat book/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
