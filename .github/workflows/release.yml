name: release

# Pushing a tag vX.Y.Z (matching [workspace.package] version) builds, tests and publishes
# paku-x86_64.exe, paku-aarch64.exe and SHA256SUMS as a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
          - arch: aarch64
            runner: windows-11-arm
            toolchain: stable-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo test --workspace --release
      - run: cargo build --release --locked
      - name: Smoke test
        run: target/release/paku.exe -V
      - name: Rename binary
        run: mkdir dist && cp target/release/paku.exe "dist/paku-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: paku-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum paku-*.exe > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
